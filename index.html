<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>João F. Corsini - Software Engineer</title>
    <meta name="title" content="João F. Corsini - Software Engineer" />
    <meta
      name="description"
      content="Full Stack Developer with 9 years of experience in building beautiful web applications."
    />
    <meta
      name="keywords"
      content="João Corsini, Software Engineer, Web Developer, React, TypeScript, Full Stack Developer, Portfolio"
    />
    <meta name="author" content="João F. Corsini" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jfcorsini.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jfcorsini.com/" />
    <meta property="og:title" content="João F. Corsini - Software Engineer" />
    <meta
      property="og:description"
      content="Full Stack Developer with 9 years of experience in building beautiful web applications."
    />
    <meta property="og:image" content="https://jfcorsini.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://jfcorsini.com/" />
    <meta
      property="twitter:title"
      content="João F. Corsini - Software Engineer"
    />
    <meta
      property="twitter:description"
      content="Full Stack Developer with 10 years of experience in building web applications end to end."
    />
    <meta
      property="twitter:image"
      content="https://jfcorsini.com/og-image.jpg"
    />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#000000" />

    <!-- Resolve the theme before first paint, otherwise a light-theme visitor
         gets a black flash while the bundle loads. -->
    <script>
      (function () {
        var stored = null;
        // Storage access throws in sandboxed iframes; the theme still has to land.
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark" || stored === "sepia"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
